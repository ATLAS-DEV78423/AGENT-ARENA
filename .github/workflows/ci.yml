name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Web app (apps/web) installs via npm and is excluded from the pnpm
      # workspace build until its deps are fully pnpm-managed.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build packages + CLI
        run: pnpm --filter './packages/*' --filter './apps/cli' build

      - name: Test
        run: pnpm test
