name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      # One red platform shouldn't hide whether the others still pass.
      fail-fast: false
      matrix:
        # win32 stays in the matrix permanently: MISTAKES.md records a
        # Windows-only bug class (win32 shim resolution / path assumptions)
        # that ubuntu-only CI cannot catch.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Cross-package imports resolve through each package's dist (package.json
      # "types"/"exports"), so build first — pnpm -r runs in dependency order
      # and the web build gates the shipped app too.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test
